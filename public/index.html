<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skillforge</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Raleway:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"></div>

<!-- Application view. Bindings are resolved by js/engine.js against SkillforgeApp.renderVals(). -->
<template id="app-template">
<div class="hdr-1 {{ rootCls }} {{ featCls }}">

<!-- SIGN IN -->
<sf-if value="{{ booting }}"><div class="sf-boot" role="status" aria-live="polite"><span class="sf-boot-logo">S</span><span class="sf-boot-txt">Loading Skillforge…</span></div></sf-if>

<sf-if value="{{ notAuthed }}">
<div class="sf-l2" data-screen-label="Sign in">
  <div class="sf-l2-brand">
    <sf-if value="{{ brLogoOn }}"><img class="sf-l2-logo-img" src="{{ brLogoSrc }}" alt="{{ brandName }} logo" style="display:block;height:52px;width:auto;max-width:220px;object-fit:contain"></sf-if><sf-if value="{{ brLogoOff }}"><div class="sf-l2-logo" style="background:{{ brandAccent }}">{{ brandInitial }}</div></sf-if>
    <div class="sf-l2-name">{{ brandName }}</div>
    <div class="sf-l2-tag">{{ brandMsg }}</div>
  </div>
  <div class="sf-l2-side">
    <div class="sf-l2-card">
      <sf-if value="{{ lgSignin }}">
        <div class="sf-l2-head">
          <h1 class="sf-l2-h">Sign in</h1>
          <sf-if value="{{ brandMsg }}"><p class="sf-l2-msg">{{ brandMsg }}</p></sf-if>
        </div>
        <sf-if value="{{ lgSetupErr }}"><div class="sf-login-err" role="alert">{{ lgSetupErr }}</div></sf-if>
        <sf-if value="{{ lgInfo }}"><div class="sf-login-info" role="status"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg><span>{{ lg.info }}</span></div></sf-if>
        <div class="sf-field">
          <label class="sf-l2-label" for="sf-user">Username</label>
          <span class="sf-fld"><svg class="sf-fld-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><input maxlength="254" id="sf-user" class="sf-in" type="text" inputmode="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" value="{{ lg.email }}" on-input="{{ setLgEmail }}" on-keydown="{{ lgKey }}" placeholder="Work email or employee ID"></span>
        </div>
        <div class="sf-field">
          <label class="sf-l2-label" for="sf-pw">Password</label>
          <span class="sf-fld"><svg class="sf-fld-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><input id="sf-pw" class="sf-in sf-in-pw" type="{{ lgPwType }}" autocomplete="current-password" value="{{ lg.pw }}" on-input="{{ setLgPw }}" on-keydown="{{ lgKey }}" placeholder="Password"><button class="sf-pw-eye" type="button" on-click="{{ toggleLgShow }}" aria-pressed="{{ lgPwShown }}" aria-label="{{ lgShowLabel }} password" title="{{ lgShowLabel }} password"><sf-if value="{{ lgPwHidden }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sf-if><sf-if value="{{ lgPwShown }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path></svg></sf-if></button></span>
          <sf-if value="{{ lgCaps }}"><div class="sf-caps" role="status">Caps Lock is on</div></sf-if>
        </div>
        <div class="sf-l2-row">
          <button class="sf-check" role="checkbox" aria-checked="{{ lgRemOn }}" aria-describedby="sf-rem-hint" title="{{ lgRemHint }}" on-click="{{ lgRemember }}"><span class="sf-check-box"><sf-if value="{{ lgRemOn }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4"><path d="M5 12l5 5 9-10"></path></svg></sf-if></span>Remember me</button>
          <span class="sf-sr" id="sf-rem-hint">{{ lgRemHint }}</span>
          <button class="sf-link sf-forgot" on-click="{{ goForgot }}">Forgot password?</button>
        </div>
        <sf-if value="{{ lgErr }}"><div class="sf-login-err" role="alert"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg><span>{{ lg.err }}</span></div></sf-if>
        <button class="sf-login-btn" on-click="{{ doLogin }}" disabled="{{ lgBusy }}" aria-busy="{{ lgBusy }}" style="background:{{ brandAccent }}"><sf-if value="{{ lgBusy }}"><span class="sf-spin" aria-hidden="true"></span></sf-if>{{ lgBtnLabel }}</button>
        <sf-if value="{{ lgShowDemo }}"><div class="sf-demo2"><span class="sf-demo2-l">Try a demo account <i>password {{ demoPw }}</i></span>
          <div class="sf-demo2-row"><sf-for list="{{ demoAccounts }}" as="d"><button class="sf-demo2-b" on-click="{{ d.pick }}" title="{{ d.name }}" style="border-color:{{ d.bd }};background:{{ d.bg }}"><b class="sf-demo2-r" style="color:{{ d.fg }}">{{ d.role }}</b><i class="sf-demo2-n">{{ d.first }}</i></button></sf-for></div></div></sf-if>
      </sf-if>
      <sf-if value="{{ lgNewPw }}">
        <button class="sf-link sf-back" on-click="{{ cancelNewPw }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>Back to sign in</button>
        <div class="sf-l2-head">
          <h1 class="sf-l2-h">{{ lgNewPwTitle }}</h1>
          <p class="sf-l2-msg">{{ lgNewPwMsg }}</p>
        </div>
        <div class="sf-field"><label class="sf-l2-label" for="sf-np1">New password</label><span class="sf-fld"><svg class="sf-fld-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><input id="sf-np1" class="sf-in" type="password" maxlength="72" autocomplete="new-password" value="{{ lg.npw }}" on-input="{{ setLgNew }}" on-keydown="{{ lgKeyNew }}"></span></div>
        <div class="sf-field"><label class="sf-l2-label" for="sf-np2">Repeat it</label><span class="sf-fld"><svg class="sf-fld-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><input id="sf-np2" class="sf-in" type="password" maxlength="72" autocomplete="new-password" value="{{ lg.npw2 }}" on-input="{{ setLgNew2 }}" on-keydown="{{ lgKeyNew }}"></span></div>
        <sf-if value="{{ lgErr }}"><div class="sf-login-err" role="alert"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg><span>{{ lg.err }}</span></div></sf-if>
        <button class="sf-login-btn" on-click="{{ saveNewPw }}" disabled="{{ lgBusy }}" aria-busy="{{ lgBusy }}" style="background:{{ brandAccent }}"><sf-if value="{{ lgBusy }}"><span class="sf-spin" aria-hidden="true"></span></sf-if>{{ lgSaveLabel }}</button>
      </sf-if>
      <sf-if value="{{ lgForgot }}">
        <button class="sf-link sf-back" on-click="{{ goSignin }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>Back to sign in</button>
        <div class="sf-l2-head">
          <h1 class="sf-l2-h">Reset password</h1>
          <p class="sf-l2-msg">Enter your work email and we’ll email you a reset link.</p>
        </div>
        <div class="sf-field"><label class="sf-l2-label" for="sf-user2">Work email</label><span class="sf-fld"><svg class="sf-fld-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg><input maxlength="254" id="sf-user2" class="sf-in" value="{{ lg.email }}" on-input="{{ setLgEmail }}" on-keydown="{{ lgKeyReset }}" placeholder="name@company.com" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"></span></div>
        <sf-if value="{{ lgErr }}"><div class="sf-login-err" role="alert"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg><span>{{ lg.err }}</span></div></sf-if>
        <button class="sf-login-btn" on-click="{{ sendReset }}" style="background:{{ brandAccent }}">Send reset link</button>
      </sf-if>
      <sf-if value="{{ lgSent }}">
        <button class="sf-link sf-back" on-click="{{ goSignin }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>Back to sign in</button>
        <div class="sf-sent-ic" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg></div>
        <div class="sf-l2-head">
          <h1 class="sf-l2-h">Check your email</h1>
          <p class="sf-l2-msg">If an account exists for <b>{{ lg.email }}</b>, a reset link is on its way. It only works for a short time, so use it soon. Nothing arrived? Check your spam folder, or ask your L&amp;D administrator to reset your password.</p>
        </div>
        <button class="sf-login-btn" on-click="{{ goSignin }}" style="background:{{ brandAccent }}">Back to sign in</button>
      </sf-if>
    </div>
  </div>
</div>
</sf-if>

<sf-if value="{{ authed }}">

<header class="hdr-2">
  <div class="hdr-3">
    <button class="hdr-4" on-click="{{ goHomeRole }}">
      <sf-if value="{{ brLogoOn }}"><img src="{{ brLogoSrc }}" alt="" style="display:block;height:34px;width:auto;max-width:120px;object-fit:contain"></sf-if><sf-if value="{{ brLogoOff }}"><span class="hdr-5">S</span></sf-if>
      <span class="hdr-6">Skillforge</span>
    </button>
    <nav class="hdr-7">
      <sf-for list="{{ navItems }}" as="n">
        <button class="hdr-9 hover-1" on-click="{{ n.go }}" style="background:{{ n.bg }};color:{{ n.fg }}">{{ n.label }}</button>
      </sf-for>
    </nav>
    <div class="hdr-10">
      <label class="sf-search {{ searchCls }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#526B7A" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input maxlength="80" class="sf-search-input" value="{{ searchQ }}" on-input="{{ setGqBar }}" on-keydown="{{ searchKey }}" placeholder="Search Skillforge" aria-label="Search">
        <sf-if value="{{ hasGq }}"><button class="sf-search-clear" on-click="{{ clearSearch }}" title="Clear">✕</button></sf-if>
      </label>
    </div>
    <div class="hdr-10">
      <button class="hdr-20 hover-3" on-click="{{ toggleNotif }}" title="Notifications"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16324F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        <sf-if value="{{ hasUnread }}"><span class="hdr-21">{{ notifCount }}</span></sf-if>
      </button>
      <sf-if value="{{ notifOpen }}">
        <div class="hdr-22">
          <div class="hdr-23"><span class="ui-2">Notifications</span><button class="hdr-24" on-click="{{ markRead }}">Mark all read</button></div>
          <sf-if value="{{ notifEmpty }}"><div class="ui-100">You’re all caught up.</div></sf-if>
          <sf-for list="{{ notifs }}" as="n">
            <div class="hdr-25" on-click="{{ n.go }}" style="background:{{ n.bg }}"><span class="hdr-26" style="background:{{ n.dot }}"></span><span class="ui-3"><span class="hdr-27">{{ n.t }}</span><span class="ui-4">{{ n.time }}</span></span></div>
          </sf-for>
        </div>
      </sf-if>
    </div>
    <sf-if value="{{ canAdmin }}">
      <button class="hdr-28 hover-3" on-click="{{ toggleAdmin }}" title="{{ gearTitle }}" style="border:1px solid {{ gearBorder }};background:{{ gearBg }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ gearFg }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.820l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
    </sf-if>
    <div class="hdr-10">
      <button class="hdr-29 hover-4" on-click="{{ toggleRoleMenu }}">
        <span class="hdr-30">{{ me.initials }}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#526B7A" stroke-width="2.5"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sf-if value="{{ roleMenu }}">
        <div class="hdr-31 pm">
          <div class="pm-head"><span class="hdr-34 pm-av">{{ me.initials }}</span><span class="ui-12"><span class="ui-95">{{ me.name }}</span><span class="ui-6">{{ me.email }}</span><span class="pm-type">{{ me.type }}</span></span></div>
          <button class="hdr-33 hover-1" on-click="{{ goAccount }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#334E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg><span class="ui-5">Account settings</span></button>
          <button class="hdr-33 hover-1" on-click="{{ goPrefs }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#334E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg><span class="ui-5">Preferences</span></button>
          <button class="hdr-33 hover-1" on-click="{{ goSecurity }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#334E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4"></path></svg><span class="ui-5">Password &amp; security</span></button>
          <sf-if value="{{ menuSettings }}"><button class="hdr-33 hover-1" on-click="{{ goSettingsMenu }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#334E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span class="ui-5">Settings</span></button></sf-if>
          <button class="hdr-33 hover-1" on-click="{{ goHelp }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#334E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"></path></svg><span class="ui-5">Help &amp; support</span></button>
          <button class="hdr-33 hover-1 sf-signout" on-click="{{ signOut }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A63232" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg><span class="ui-5">Sign out</span></button>
        </div>
      </sf-if>
    </div>
  </div>
</header>

<main class="lay-1">

<!-- LEARNER HOME -->
<sf-if value="{{ isDenied }}">
<div class="lay-4" data-screen-label="Permission denied">
  <div class="permission-denied-1">🔒</div>
  <h1 class="permission-denied-2">You don't have access to this area</h1>
  <div class="permission-denied-3">This section is limited to administrators. If you need access, ask your L&amp;D administrator to update your role.</div>
  <button class="permission-denied-4" on-click="{{ deniedBack }}">Back to my home</button>
</div>
</sf-if>
<sf-if value="{{ isHome }}">
<div class="permission-denied-5" data-screen-label="Learner dashboard">
  <div class="learner-dashboard-1">
    <div>
      <div class="learner-dashboard-2">{{ todayLabel }}</div>
      <h1 class="learner-dashboard-3">{{ greeting }}, {{ firstName }}</h1>
      <div class="learner-dashboard-4">{{ dueLine }}</div>
    </div>
  </div>
  <nav class="sf-sum" aria-label="Your learning at a glance">
    <sf-for list="{{ dashStats }}" as="d"><button class="sf-sum-i" on-click="{{ d.go }}" title="{{ d.hint }}" style="--tc:{{ d.color }};--tt:{{ d.tint }}"><b>{{ d.v }}</b> {{ d.label }}</button></sf-for>
  </nav>
  <sf-if value="{{ essHasOver }}">
    <div class="ess-banner ess-red" role="alert"><span class="ess-ic">!</span><div class="ui-12"><div class="ui-95">Essential training overdue</div><sf-for list="{{ essOver }}" as="e"><div class="ess-line"><span>{{ e.title }} · {{ e.when }}</span><button class="ess-go" on-click="{{ e.open }}">Start now →</button></div></sf-for></div></div>
  </sf-if>
  <sf-if value="{{ essHasSoon }}">
    <div class="ess-banner ess-amber"><span class="ess-ic">⏱</span><div class="ui-12"><div class="ui-95">Essential training for new joiners</div><sf-for list="{{ essSoon }}" as="e"><div class="ess-line"><span>{{ e.title }} · {{ e.when }}</span><button class="ess-go" on-click="{{ e.open }}">Open →</button></div></sf-for></div></div>
  </sf-if>
  <div class="learner-dashboard-5">
    <div class="learner-dashboard-6">
      <div class="sf-home-row">

        <label class="ui-61"><span class="ui-8">Phone number</span><input maxlength="20" class="ovl-29" aria-invalid="{{ udBad.phone }}" style="border:1.5px solid {{ udBd.phone }};background:{{ udBg.phone }}" type="tel" inputmode="tel" value="{{ ud.phone }}" on-input="{{ setUdPhone }}" placeholder="+91 98765 43210"><sf-if value="{{ udMsg.phone }}"><span class="ui-6" style="color:#B42318">{{ udMsg.phone }}</span></sf-if></label>
      </div>
      <div class="ovl-23">
        <label class="ui-61"><span class="ui-8">Designation</span><input maxlength="60" class="ovl-29" aria-invalid="{{ udBad.designation }}" style="border:1.5px solid {{ udBd.designation }};background:{{ udBg.designation }}" value="{{ ud.designation }}" on-input="{{ setUdDesig }}" placeholder="e.g. CS Specialist"><sf-if value="{{ udMsg.designation }}"><span class="ui-6" style="color:#B42318">{{ udMsg.designation }}</span></sf-if></label>
        <label class="ui-61"><span class="ui-8">Date of joining</span><input class="ovl-29" aria-invalid="{{ udBad.joined }}" style="border:1.5px solid {{ udBd.joined }};background:{{ udBg.joined }}" type="date" value="{{ ud.joined }}" on-input="{{ setUdJoined }}"><sf-if value="{{ udMsg.joined }}"><span class="ui-6" style="color:#B42318">{{ udMsg.joined }}</span></sf-if></label>
      </div>
      <div class="ui-61"><span class="ui-8">Gender</span><div class="ui-87"><sf-for list="{{ udGenders }}" as="o"><button class="ovl-30" on-click="{{ o.pick }}" style="border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button></sf-for></div></div>
      <div class="ui-61"><span class="ui-8">Terms accepted</span><div class="ui-87"><sf-for list="{{ udTerms }}" as="o"><button class="ovl-30" on-click="{{ o.pick }}" style="border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button></sf-for></div></div>
      <label class="ui-61"><span class="ui-8">Role</span><sf-select class="ovl-31" value="{{ ud.roleId }}" on-change="{{ setUdRole }}"><sf-for list="{{ udRoleOpts }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sf-for></sf-select><span class="ui-6">{{ udRoleHint }}</span></label>
      <div class="ovl-23">
        <label class="ui-61"><span class="ui-8">Department</span><sf-select class="ovl-31" value="{{ ud.dept }}" on-change="{{ setUdDept }}"><sf-for list="{{ deptOptions }}" as="o"><option value="{{ o }}">{{ o }}</option></sf-for></sf-select></label>
        <label class="ui-61"><span class="ui-8">Manager</span><sf-select class="ovl-31" value="{{ ud.manager }}" on-change="{{ setUdManager }}"><sf-for list="{{ managerOptions }}" as="o"><option value="{{ o }}">{{ o }}</option></sf-for></sf-select></label>
      </div>
      <div class="ovl-26">
        <button class="ui-60" on-click="{{ closeUserModal }}">Cancel</button>
        <button class="ovl-32" on-click="{{ saveUser }}">{{ udBtn }}</button>
      </div>
    </div>
  </div>
</sf-if>

</sf-if>
<div class="sf-sr" role="status" aria-live="polite">{{ toast }}</div>
<sf-if value="{{ hasToast }}">
  <div class="ovl-33 {{ toastCls }}" aria-hidden="true"><span class="ovl-34"></span><span class="ovl-33t">{{ toast }}</span><button class="ovl-33x" on-click="{{ toastClose }}" tabindex="-1" title="Close">✕</button></div>
</sf-if>

</div>
</template>
