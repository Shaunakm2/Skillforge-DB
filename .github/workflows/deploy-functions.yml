name: deploy-functions
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes supabase@2 --version
      - run: npx --yes supabase@2 functions deploy learning --project-ref "$PROJECT_REF"
      - run: npx --yes supabase@2 functions deploy admin-users --project-ref "$PROJECT_REF"
      - run: npx --yes supabase@2 functions deploy content --no-verify-jwt --project-ref "$PROJECT_REF"
