name: deploy-functions
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy learning --project-ref "$PROJECT_REF"
      - run: supabase functions deploy admin-users --project-ref "$PROJECT_REF"
      - run: supabase functions deploy content --no-verify-jwt --project-ref "$PROJECT_REF"
