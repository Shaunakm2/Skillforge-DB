<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Workplace safety · interactive module</title>
<style>
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#F4F8FC;color:#16324F;display:flex;flex-direction:column;min-height:100vh}
header{padding:14px 22px;background:#16324F;color:#F8FBFD;font-weight:700;display:flex;justify-content:space-between;font-size:14px}
main{flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:24px}p{margin:0;line-height:1.55;color:#334E68}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid #D7E3EC;background:#fff;font:inherit;cursor:pointer}
.opts button.ok{border-color:#007A4D;background:#E3F1EE}.opts button.bad{border-color:#D64545;background:#FDECEC}
footer{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid #D7E3EC;background:#fff}
.btn{border:0;border-radius:999px;padding:10px 20px;font:inherit;font-weight:700;background:#16324F;color:#F8FBFD;cursor:pointer}
.btn:disabled{background:#D7E3EC;color:#526B7A;cursor:default}
.dots{display:flex;gap:6px}.dots span{width:24px;height:6px;border-radius:9px;background:#D7E3EC}.dots span.on{background:#0066A1}
</style></head><body>
<header><span>Workplace safety · interactive module</span><span id="pos"></span></header>
<main id="m"></main>
<footer><div class="dots" id="dots"></div><button class="btn" id="next">Next</button></footer>
<script>
/* Minimal SCORM 1.2 package: uses the LMS API (window.parent.API) when present, otherwise postMessage. */
var API=(function(){var w=window;for(var i=0;w&&i<10;i++){try{if(w.API)return w.API}catch(e){}if(w.parent===w)break;w=w.parent}return null})();if(API){API.LMSInitialize('');}
const S=[
 {t:'Scenario: the wet floor',p:'You walk into the pantry and notice water spreading from the coffee machine. Two colleagues are about to walk through it.',q:{o:['Ignore it, someone else will report it','Warn them, mark the area and report it','Mop it yourself and say nothing'],a:1}},
 {t:'Scenario: the fire alarm',p:'The fire alarm goes off while you are on a video call. Your laptop and bag are on your desk.',q:{o:['Finish the call first','Take the lift down with your laptop','Leave now by the nearest marked exit'],a:2}},
 {t:'You are done',p:'You spotted the hazard, chose the safe action and know where to go. Select Finish to record your completion.'}];
let i=0,ans={};
const m=document.getElementById('m'),nx=document.getElementById('next');
function draw(){const s=S[i];document.getElementById('pos').textContent=(i+1)+' / '+S.length;
 document.getElementById('dots').innerHTML=S.map((_,k)=>'<span class="'+(k<=i?'on':'')+'"></span>').join('');
 m.innerHTML='<h1>'+s.t+'</h1><p>'+s.p+'</p>'+(s.q?'<div class="opts">'+s.q.o.map((o,k)=>'<button data-k="'+k+'">'+o+'</button>').join('')+'</div>':'');
 nx.textContent=i===S.length-1?'Finish':'Next'; nx.disabled=!!s.q&&ans[i]!==s.q.a;
 m.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;ans[i]=k;m.querySelectorAll('.opts button').forEach(x=>x.className='');b.className=k===s.q.a?'ok':'bad';nx.disabled=k!==s.q.a;});}
nx.onclick=()=>{if(i<S.length-1){i++;draw();if(API){API.LMSSetValue('cmi.core.lesson_location','Screen '+(i+1)+' of '+S.length);API.LMSCommit('');}}else{if(API){API.LMSSetValue('cmi.core.score.raw','100');API.LMSSetValue('cmi.core.lesson_status','completed');API.LMSCommit('');API.LMSFinish('');}else parent.postMessage({type:'scorm',status:'completed',score:100},'*');nx.disabled=true;nx.textContent='Completed';}};
parent.postMessage({type:'scorm',status:'incomplete'},'*');draw();
</script></body></html>
